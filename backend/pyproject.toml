[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0",
    "authlib>=1.6.0",
    "bitsandbytes>=0.49.0",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "fastembed>=0.8.1",
    "flagembedding>=1.4.2",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "psycopg>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pypdf>=6.0.0",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.1",
    "tavily-python>=0.7.0",
    "torch>=2.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
